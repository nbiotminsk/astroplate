name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine Changes & Fast Deploy API
        id: check_mode
        run: |
          NON_API_CHANGES=$(git diff --name-only HEAD~1 HEAD | grep -v '^public/api/' || true)
          API_CHANGES=$(git diff --name-only HEAD~1 HEAD | grep '^public/api/' || true)

          if [ -z "$NON_API_CHANGES" ] && [ -n "$API_CHANGES" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "⚡ ONLY API files changed. Fast deploying to deploy branch..."
            git fetch origin deploy:deploy
            git checkout deploy
            git checkout main -- public/api
            rm -rf api
            mkdir -p api
            cp -r public/api/* api/
            rm -rf public
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add api
            if git diff --staged --quiet; then
              echo "No diff in api files."
            else
              git commit -m "Fast Deploy (API only): ${{ github.sha }} [skip ci]"
              git push origin deploy
            fi
            echo "mode=fast" >> $GITHUB_OUTPUT
          else
            echo "🔨 Full site build needed."
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_mode.outputs.mode == 'full'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check_mode.outputs.mode == 'full'
        run: npm ci

      - name: Run Check (Lint & Types)
        if: steps.check_mode.outputs.mode == 'full'
        run: |
          node scripts/themeGenerator.js
          node scripts/jsonGenerator.js
          npm run check

      - name: Build Project
        if: steps.check_mode.outputs.mode == 'full'
        run: npm run build

      - name: Prepare for Deployment
        if: steps.check_mode.outputs.mode == 'full'
        run: |
          touch dist/.nojekyll
          if [ -f dist/htaccess.txt ]; then
            cp dist/htaccess.txt dist/.htaccess
            chmod 644 dist/.htaccess
          fi

      - name: Deploy Full Site to Deploy Branch
        if: steps.check_mode.outputs.mode == 'full'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
          commit_message: "Deploy: ${{ github.sha }} [skip ci]"

      - name: Trigger Hosting Webhook
        run: |
          curl -f -X POST "https://by4010.hb.by:8443/modules/git/public/web-hook.php?uuid=545844a5-6f56-2a7d-37aa-0a92eb58d127"
