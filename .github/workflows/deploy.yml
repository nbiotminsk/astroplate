name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters:
            site:
              - '!(public/api/**)'
            api:
              - 'public/api/**'

  deploy-api-fast:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.site == 'false' && needs.check-changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (for API files)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy
          path: deploy-repo

      - name: Sync API files into deploy branch
        run: |
          mkdir -p deploy-repo/api
          rsync -av --delete main-repo/public/api/ deploy-repo/api/
          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/
          if git diff --staged --quiet; then
            echo "No changes in API files."
          else
            git commit -m "Fast Deploy (API only): ${{ github.sha }} [skip ci]"
            git push origin deploy
          fi

      - name: Trigger Hosting Webhook
        run: |
          curl -f -X POST "https://by4010.hb.by:8443/modules/git/public/web-hook.php?uuid=545844a5-6f56-2a7d-37aa-0a92eb58d127"

  deploy-full-site:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.site == 'true' || (needs.check-changes.outputs.site == 'false' && needs.check-changes.outputs.api == 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Check (Lint & Types)
        run: |
          node scripts/themeGenerator.js
          node scripts/jsonGenerator.js
          npm run check

      - name: Build Project
        run: npm run build

      - name: Prepare for Deployment
        run: |
          touch dist/.nojekyll
          if [ -f dist/htaccess.txt ]; then
            cp dist/htaccess.txt dist/.htaccess
            chmod 644 dist/.htaccess
          fi

      - name: Deploy to Deploy Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
          commit_message: "Deploy: ${{ github.sha }} [skip ci]"

      - name: Trigger Hosting Webhook
        run: |
          curl -f -X POST "https://by4010.hb.by:8443/modules/git/public/web-hook.php?uuid=545844a5-6f56-2a7d-37aa-0a92eb58d127"
